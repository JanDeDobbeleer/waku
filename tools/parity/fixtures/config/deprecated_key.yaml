# global deprecated keys are dropped with a warning; scoped ones only in their model
bars:
  main:
    blur_effect:
      enabled: false
      acrylic: true
    widgets:
      left: [cpu]
widgets:
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "{info[percent][total]}%"
      label_shadow:
        color: black
      container_padding:
        top: 1
      update_interval: 2000
