version: 2
updates:
  # Every action is pinned to a commit SHA with the version in a trailing comment;
  # Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # builtin-baseline in vcpkg.json (nlohmann-json, gtest).
  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  # aqtinstall, which installs Qt in CI. The Qt version itself (QT_VERSION in the workflows,
  # docs/building.md) is a deliberate manual bump.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
