name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  QT_ROOT: C:/Qt/6.12.0
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            preset: x64-release
            vcvars_arch: x64
            qt_arch: win64_msvc2022_64
            qt_host: windows
          - runner: windows-11-arm
            preset: arm64-release
            vcvars_arch: arm64
            qt_arch: win64_msvc2022_arm64
            qt_host: windows_arm64
          - runner: windows-11-arm
            preset: arm64-debug
            vcvars_arch: arm64
            qt_arch: win64_msvc2022_arm64
            qt_host: windows_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manifest baseline needs the vcpkg git history, so check out the pinned commit.
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          "sha=$b" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg

      # Not bootstrap-vcpkg.bat: it downloads vcpkg.exe once, with no retry. The script retries,
      # checks the Microsoft signature and takes the exe from the cache when it can.
      - name: Read vcpkg tool tag
        id: vcpkg_tool
        shell: pwsh
        run: .github/scripts/install-vcpkg.ps1 -Mode Tag -Arch ${{ matrix.vcvars_arch }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-tool
          key: vcpkg-tool-${{ matrix.vcvars_arch }}-${{ steps.vcpkg_tool.outputs.tag }}

      - name: Install vcpkg
        shell: pwsh
        run: .github/scripts/install-vcpkg.ps1 -Mode Install -Arch ${{ matrix.vcvars_arch }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m aqt install-qt ${{ matrix.qt_host }} desktop $env:QT_VERSION ${{ matrix.qt_arch }} -m qtimageformats -O C:/Qt

      - name: Set up the MSVC environment
        shell: pwsh
        run: .github/scripts/msvc-env.ps1 -Arch ${{ matrix.vcvars_arch }}

      # Compiler cache: an unchanged translation unit is not compiled again.
      - name: Install ccache
        shell: pwsh
        run: .github/scripts/install-ccache.ps1 -Arch ${{ matrix.vcvars_arch }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The portable folder: waku.exe, wakuc.exe, wakukeys.exe, WakuTrayHook*.dll, the Qt runtime, modules/, examples/.
      - name: Deploy
        if: matrix.preset != 'arm64-debug'
        run: cmake --build --preset ${{ matrix.preset }} --target deploy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.preset != 'arm64-debug'
        with:
          name: waku-${{ matrix.preset }}
          path: dist/waku
