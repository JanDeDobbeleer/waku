name: release

# A push to main that changes shipped files computes the next version from the conventional
# commits since the last tag (feat: minor, fix and perf: patch, breaking change: major). With
# nothing to release the run stops after the changelog job. Otherwise it builds, signs and
# packages both architectures, tags the commit and publishes a release with the changelog as
# its notes. Run the workflow by hand to dry-run the packaging: it uploads the MSIX files as
# artifacts and publishes nothing.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "cmake/**"
      - "examples/**"
      - "packaging/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without v (for example 0.1.0). Empty uses the next version from the commits."
        required: false
      sign:
        description: "Sign the packages with Azure Trusted Signing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}

env:
  QT_VERSION: "6.10.2"
  QT_ROOT: C:/Qt/6.10.2
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.clean_changelog }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reads the commits since the last tag. It writes no file, makes no commit and no tag.
      - name: Create changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-version-file: "true"
          output-file: "false"
          skip-commit: "true"
          skip-on-empty: "true"
          skip-tag: "true"

      - id: version
        shell: bash
        env:
          COMMITS_VERSION: ${{ steps.changelog.outputs.version }}
          COMMITS_TAG: ${{ steps.changelog.outputs.tag }}
          COMMITS_SKIPPED: ${{ steps.changelog.outputs.skipped }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$COMMITS_SKIPPED" = "false" ]; then
              release=true; v="${COMMITS_VERSION#v}"
            fi
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [ "$COMMITS_SKIPPED" = "false" ]; then
            v="${COMMITS_VERSION#v}"
          else
            echo "no releasable commits since the last tag and no version input" >&2
            exit 1
          fi
          if [ "$release" = "true" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version '$v' is not <major>.<minor>.<patch>" >&2
              exit 1
            fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "next version: ${v:-none} (publish: $release)"

  build:
    name: build ${{ matrix.arch }}
    needs: changelog
    if: ${{ needs.changelog.outputs.version != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            preset: x64-release
            vcvars_arch: x64
            qt_arch: win64_msvc2022_64
            qt_host: windows
          - arch: arm64
            runner: windows-11-arm
            preset: arm64-release
            vcvars_arch: arm64
            qt_arch: win64_msvc2022_arm64
            qt_host: windows_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manifest baseline needs the vcpkg git history, so check out the pinned commit.
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          "sha=$b" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m aqt install-qt ${{ matrix.qt_host }} desktop $env:QT_VERSION ${{ matrix.qt_arch }} -m qtimageformats -O C:/Qt

      - name: Set up the MSVC environment
        shell: pwsh
        run: .github/scripts/msvc-env.ps1 -Arch ${{ matrix.vcvars_arch }}

      # Compiler cache: an unchanged translation unit is not compiled again.
      - name: Install ccache
        shell: pwsh
        run: .github/scripts/install-ccache.ps1 -Arch ${{ matrix.vcvars_arch }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Configure
        # Quoted: PowerShell splits an unquoted -DNAME=0.1.0 at the first dot.
        run: cmake --preset ${{ matrix.preset }} "-DWAKU_VERSION=${{ needs.changelog.outputs.version }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Deploy
        run: cmake --build --preset ${{ matrix.preset }} --target deploy

      # Qt and waku use the dynamic CRT. A package cannot run vc_redist, so ship the CRT next to
      # waku.exe (app-local deployment).
      - name: Bundle the C++ runtime
        shell: pwsh
        run: |
          $crt = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir '${{ matrix.arch }}') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "no CRT redistributable for ${{ matrix.arch }} under $env:VCToolsRedistDir" }
          Copy-Item -Path (Join-Path $crt.FullName '*.dll') -Destination dist/waku
          Remove-Item -Path dist/waku/vc_redist.*.exe -ErrorAction SilentlyContinue
          Get-ChildItem dist/waku/*.dll | Where-Object Name -Like 'vcruntime*' | ForEach-Object Name

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/waku
          if-no-files-found: error

  package:
    name: package ${{ matrix.arch }}
    needs: [changelog, build]
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/waku

      # Sign tagged releases. A manual run signs only when asked.
      - name: Build the MSIX
        working-directory: packaging/msix
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN: ${{ needs.changelog.outputs.release == 'true' || inputs.sign }}
        run: |
          $params = @{
              Architecture = '${{ matrix.arch }}'
              Version      = '${{ needs.changelog.outputs.version }}'
              Source       = '../../dist/waku'
          }
          if ($env:SIGN -eq 'true') { $params.Sign = $true }
          ./build.ps1 @params

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-${{ matrix.arch }}
          path: |
            packaging/msix/out/waku-${{ matrix.arch }}.msix
            packaging/msix/out/waku-${{ matrix.arch }}.appinstaller
          if-no-files-found: error

  release:
    if: ${{ needs.changelog.outputs.release == 'true' }}
    needs: [changelog, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msix-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: sha256sum waku-* > checksums.txt

      # gh creates the tag on the commit that was built.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.changelog.outputs.body }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "${{ needs.changelog.outputs.tag }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "waku ${{ needs.changelog.outputs.version }}" \
            --notes-file notes.md
