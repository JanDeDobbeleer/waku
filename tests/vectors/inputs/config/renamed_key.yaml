# scoped rename: ActiveLayoutIconsConfig.maximised -> maximized
bars:
  main:
    widgets:
      left: [layout, layout_both]
widgets:
  layout:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      layout_icons:
        maximised: "[MAX]"
  layout_both:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      layout_icons:
        maximised: "[OLD]"
        maximized: "[NEW]"
