# the exporter defines YASB_PARITY_VAR=from-env; YASB_PARITY_UNDEFINED is never defined
bars:
  main:
    class_name: "$env:YASB_PARITY_VAR"
    widgets:
      left: [cpu]
widgets:
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "$Env:YASB_PARITY_VAR / $ENV:yasb_parity_var / [$env:YASB_PARITY_UNDEFINED] ${env:YASB_PARITY_VAR} $env:"
      label_alt: "x$env:YASB_PARITY_VARy"
      class_name: "$env:YASB_PARITY_VAR"
      histogram_icons: ["$env:YASB_PARITY_VAR", "b", "c", "d", "e", "f", "g", "h", "i"]
